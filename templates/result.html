<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SENTRA Analysis</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <header>

        <h1>SENTRA</h1>

        <p>Battlefield Acoustic Threat Sentinel</p>

    </header>


    <main>

        <section class="welcome">

            <h2>Threat Analysis Result</h2>


            <div class="card">

                <h3>Detected Sound</h3>

                <h2>{{ result.upper() }}</h2>


                <p>

                    Confidence:

                    <strong>
                        {{ confidence }}%
                    </strong>

                </p>


                {% if result == "normal" %}

                    <p>
                        Status: SAFE
                    </p>

                {% else %}

                    <p>
                        Status: THREAT DETECTED
                    </p>

                {% endif %}

            </div>

        </section>

    </main>


</body>

</html>
